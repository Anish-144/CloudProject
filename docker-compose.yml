version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudguard_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudguard_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: cloudguard_gateway
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./gateway:/app
    restart: unless-stopped

  finops_engine:
    build:
      context: ./finops_engine
      dockerfile: Dockerfile
    container_name: cloudguard_finops
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    volumes:
      - ./finops_engine:/app
    restart: unless-stopped

  compliance_engine:
    build:
      context: ./compliance_engine
      dockerfile: Dockerfile
    container_name: cloudguard_compliance
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    volumes:
      - ./compliance_engine:/app
    restart: unless-stopped

  alert_service:
    build:
      context: ./alert_service
      dockerfile: Dockerfile
    container_name: cloudguard_alerts
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./alert_service:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudguard_frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
      - alert_service
    restart: unless-stopped

volumes:
  postgres_data:
